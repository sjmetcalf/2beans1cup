<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2beans1cup — now brewing</title>
  <meta name="description" content="Two athletes, one cup. Training for the Grand Traverse Triple Crown.">
  <style>
    :root { --crema:#f4ede3; --roast:#2b1d14; --clay:#b4683f; --muted:#7a6a5c; }
    * { box-sizing:border-box; margin:0; }
    body {
      min-height:100vh; display:grid; place-items:center;
      background:var(--crema); color:var(--roast);
      font-family: ui-sans-serif, "Helvetica Neue", Arial, sans-serif;
      padding:2rem;
    }
    main { max-width:34rem; text-align:center; }
    .mark { font-size:.75rem; letter-spacing:.35em; text-transform:uppercase; color:var(--muted); }
    h1 {
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      font-weight:400; font-size:clamp(3rem, 10vw, 5.5rem); line-height:1; margin:1.25rem 0;
      letter-spacing:-.02em;
    }
    h1 em { font-style:italic; color:var(--clay); }
    p { color:var(--muted); line-height:1.6; }
    hr { width:3rem; border:0; border-top:1px solid var(--clay); margin:2rem auto; }
    .legs { display:flex; justify-content:center; gap:1.5rem; font-size:.8rem; letter-spacing:.2em; text-transform:uppercase; }
  </style>
</head>
<body>
  <main>
    <div class="mark">Est. 2026 &middot; Crested Butte &rarr; Aspen</div>
    <h1>2 beans<br><em>1 cup</em></h1>
    <p>A small-batch training house for two. Now brewing.</p>
    <hr>
    <div class="legs"><span>Ski</span><span>Run</span><span>Bike</span></div>
  </main>
</body>
</html>
